[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-training-risk-replay"
version = "0.2.0"
description = "Time-correct, recommendation-only RL experiment reliability"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
research = [
  "duckdb>=1.1",
  "pandas>=2.0",
  "pyarrow>=15",
  "numpy>=1.26",
  "scipy>=1.10",
  "scikit-learn>=1.4",
]

[project.scripts]
rl-risk = "rl_risk_replay.__main__:main"
rl-research = "research.__main__:main"

[tool.setuptools.packages.find]
include = ["rl_risk_replay*", "research*"]
