name: Reliability validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-core-dev.txt
      - name: Install core development tools and package
        run: |
          python -m pip install -r requirements-core-dev.txt
          python -m pip install --no-deps -e .
      - name: Strict-core unit, adversarial and archive-gate tests
        run: python -m pytest tests_v2/ -q --junitxml=core-junit.xml
      - name: Required strict-core type gate
        run: python -m pyright --project pyright-core.json
      - name: Controlled RL and future-mutation experiments
        run: python scripts/validate_reliability_v2.py --out artifacts/reliability-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-v2-${{ matrix.os }}
          path: |
            artifacts/reliability-v2/
            core-junit.xml
          if-no-files-found: warn
  research-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and pinned audit tools
        # pyproject.toml declares the research layer's runtime dependencies;
        # a plain `pip install -e .` must therefore make `rl-research` usable.
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-cov ruff==0.17.3
          python -m pip freeze > pip-freeze.txt
      - name: Research layer and portable time-isolation contracts
        run: python -m pytest tests_research/ tests_v2/test_contracts.py -q --cov=research --cov-report=xml --cov-report=term
      - name: Registered claims must reproduce exactly
        run: python -m audit claims --verify
      - name: Rule definitions must come from the single source
        run: python -m audit rules
      - name: CI dependency snapshots must match pyproject.toml
        run: python -m audit deps
      - name: Full-history credential scan with explicit incident allowlist
        # Runs before the archive checkout is created, so only main's worktree
        # is scanned. The excluded prefix is a second line of defence.
        run: python -m audit secrets
      - name: Full lint gate on active code
        run: python -m ruff check rl_risk_replay research audit contracts tests_v2 tests_research scripts
      - name: Record reproduction environment
        run: python -m audit env | tee audit-environment.json
      - name: Check out the archived v1 branch for content verification
        uses: actions/checkout@v4
        with:
          ref: archive/v1
          path: .archive-checkout
      - name: Archived artifacts must match the pinned SHA-256 manifest
        # Proves the archive branch still holds exactly the 142 artifacts that
        # main's data/manifest.json pins, without keeping their bodies on main.
        run: python -m audit data --root .archive-checkout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-audit
          path: |
            coverage.xml
            pip-freeze.txt
            audit-environment.json
          if-no-files-found: warn
