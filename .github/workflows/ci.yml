name: Reliability validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-core-dev.txt
      - name: Install core development tools and package
        run: |
          python -m pip install -r requirements-core-dev.txt
          python -m pip install --no-deps -e .
      - name: Strict-core unit and adversarial tests
        run: python -m pytest tests_v2/ -q --junitxml=core-junit.xml
      - name: Required strict-core type gate
        run: python -m pyright --project pyright-core.json
      - name: Controlled RL and future-mutation experiments
        run: python scripts/validate_reliability_v2.py --out artifacts/reliability-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-v2-${{ matrix.os }}
          path: |
            artifacts/reliability-v2/
            core-junit.xml
          if-no-files-found: warn
  legacy-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install historical analysis dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Preserve historical unit and offline regressions
        run: python -m pytest tests/ -q --junitxml=legacy-junit.xml
      - name: Historical data audit and v1 negative control
        run: python scripts/validate_reliability_v2.py --include-legacy --out artifacts/legacy-validation
      - name: Full type check (advisory; historical type debt)
        continue-on-error: true
        run: python -m pyright --pythonpath "$(command -v python)" --outputjson > pyright-results.json
      - name: Summarize advisory diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('pyright-results.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Full repository typing is advisory; strict-core typing is required\n')
              if p.exists():
                  try:
                      s = json.loads(p.read_text())['summary']
                      out.write(f"Files: {s['filesAnalyzed']}; errors: {s['errorCount']}; warnings: {s['warningCount']}\n")
                  except (ValueError, KeyError):
                      out.write('Unparseable advisory report; inspect logs.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-regression-and-inventory
          path: |
            legacy-junit.xml
            pyright-results.json
            artifacts/legacy-validation/
          if-no-files-found: warn
