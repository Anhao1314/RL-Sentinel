<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="850" y1="120" x2="1180" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>
  <rect x="0" width="1280" height="8" fill="#2563EB"/>

  <text x="76" y="100" font-size="18" letter-spacing="3.5" fill="#64748B" font-weight="700">RL EXPERIMENT RELIABILITY · v0.2</text>
  <text x="74" y="187" font-size="58" font-weight="800" fill="#0F172A">Training Reliability</text>
  <text x="74" y="252" font-size="58" font-weight="800" fill="#0F172A">&amp; Risk Replay</text>
  <text x="76" y="310" font-size="24" fill="#334155">Reconstruct what was knowable at decision time.</text>
  <text x="76" y="345" font-size="24" fill="#334155">Replay recommendations without silently reading the future.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">
    <rect x="76" y="392" width="170" height="42" rx="21" fill="#DBEAFE"/>
    <text x="161" y="419" text-anchor="middle" fill="#1D4ED8">AS-OF REPLAY</text>
    <rect x="258" y="392" width="174" height="42" rx="21" fill="#E0E7FF"/>
    <text x="345" y="419" text-anchor="middle" fill="#4338CA">IMMUTABLE EVENTS</text>
    <rect x="444" y="392" width="180" height="42" rx="21" fill="#ECFDF5"/>
    <text x="534" y="419" text-anchor="middle" fill="#047857">EVIDENCE BUNDLES</text>
  </g>

  <g>
    <rect x="76" y="478" width="176" height="84" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="94" y="508" font-size="15" fill="#64748B">STRICT CORE</text>
    <text x="94" y="540" font-size="26" font-weight="800" fill="#0F172A">62 + 25</text>
    <text x="94" y="558" font-size="13" fill="#64748B">tests + subtests / OS</text>

    <rect x="268" y="478" width="176" height="84" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="286" y="508" font-size="15" fill="#64748B">FUTURE MUTATIONS</text>
    <text x="286" y="540" font-size="26" font-weight="800" fill="#0F172A">200 / 200</text>
    <text x="286" y="558" font-size="13" fill="#64748B">historical decisions stable</text>

    <rect x="460" y="478" width="176" height="84" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="478" y="508" font-size="15" fill="#64748B">CONTROLLED RL</text>
    <text x="478" y="540" font-size="26" font-weight="800" fill="#0F172A">18 runs</text>
    <text x="478" y="558" font-size="13" fill="#64748B">6 pass · 12 fail</text>
  </g>

  <g>
    <rect x="780" y="92" width="424" height="452" rx="28" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="824" y="128" width="336" height="64" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="992" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Training Observer</text>
    <text x="992" y="177" text-anchor="middle" font-size="13" fill="#64748B">start · sample · finish · label</text>
    <path d="M992 192V221" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="824" y="226" width="336" height="64" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="992" y="253" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Availability-Gated Event Store</text>
    <text x="992" y="275" text-anchor="middle" font-size="13" fill="#64748B">transactional · append-only</text>
    <path d="M992 290V319" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="824" y="324" width="336" height="64" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <text x="992" y="351" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">As-Of Snapshot at T</text>
    <text x="992" y="373" text-anchor="middle" font-size="13" fill="#64748B">no final verdict · no future run</text>
    <path d="M992 388V417" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="824" y="422" width="336" height="78" rx="14" fill="url(#blue)"/>
    <text x="992" y="452" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">Recommendation → Replay</text>
    <text x="992" y="478" text-anchor="middle" font-size="13" fill="#DBEAFE">metrics · evidence · SHA-256 manifest</text>
  </g>

  <text x="1200" y="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#2563EB">github.com/Anhao1314</text>
</svg>