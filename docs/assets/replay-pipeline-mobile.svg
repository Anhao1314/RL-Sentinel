<svg xmlns="http://www.w3.org/2000/svg" width="480" height="760" viewBox="0 0 480 760" role="img" aria-labelledby="title desc"><title id="title">RL Sentinel: narrow-screen information boundary</title><desc id="desc">Four stages lead from observations to recommendations; target outcomes join only for scoring, never as target predictor inputs.</desc><style>.bg{fill:#F3F7F5}.panel{fill:#fff;stroke:#C7D9D0;stroke-width:1.5}.ink{fill:#172E27}.muted{fill:#536D63}.accent{fill:#087F6A}.signal{fill:#087F6A}.signaltext{fill:#fff}.arrow{fill:none;stroke:#749889;stroke-width:2}.quiet{fill:#E4EDE8}
@media(prefers-color-scheme:dark){.bg{fill:#101918}.panel{fill:#162923;stroke:#365449}.ink{fill:#EDF8F5}.muted{fill:#ADC1BA}.accent{fill:#5EEAD4}.signal{fill:#196957}.signaltext{fill:#F2FFFA}.arrow{stroke:#82AB9B}.quiet{fill:#20392F}}</style><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" class="arrow"/></marker></defs><rect width="480" height="760" rx="18" class="bg"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"><text x="28" y="48" class="ink" font-size="25" font-weight="700">The information boundary</text><rect x="28" y="80" width="424" height="90" rx="12" class="panel"/><text x="50" y="113" class="accent" font-size="16" font-weight="700">01</text><text x="90" y="116" class="ink" font-size="26" font-weight="700">Observe</text><text x="90" y="145" class="muted" font-size="18">Lifecycle + training samples</text><path d="M240 170v20" class="arrow" marker-end="url(#tip)"/><rect x="28" y="198" width="424" height="90" rx="12" class="panel"/><text x="50" y="231" class="accent" font-size="16" font-weight="700">02</text><text x="90" y="234" class="ink" font-size="26" font-weight="700">Store</text><text x="90" y="263" class="muted" font-size="18">Append-only SQLite events</text><path d="M240 288v20" class="arrow" marker-end="url(#tip)"/><rect x="28" y="316" width="424" height="90" rx="12" class="panel"/><text x="50" y="349" class="accent" font-size="16" font-weight="700">03</text><text x="90" y="352" class="ink" font-size="26" font-weight="700">Select @ T</text><text x="90" y="381" class="muted" font-size="18">Only available evidence + history</text><path d="M240 406v20" class="arrow" marker-end="url(#tip)"/><rect x="28" y="434" width="424" height="90" rx="12" class="panel"/><text x="50" y="467" class="accent" font-size="16" font-weight="700">04</text><text x="90" y="470" class="ink" font-size="26" font-weight="700">Recommend</text><text x="90" y="499" class="muted" font-size="18">Local advice, no intervention</text><path d="M240 524v20" class="arrow" marker-end="url(#tip)"/><rect x="28" y="552" width="424" height="112" rx="12" class="signal"/><text x="50" y="590" class="signaltext" font-size="26" font-weight="700">Score + verify</text><text x="50" y="623" class="signaltext" font-size="19">Target outcomes join here only.</text><text x="50" y="647" class="signaltext" font-size="17">Metrics + decision inputs + manifest</text><rect x="28" y="694" width="424" height="42" rx="10" class="quiet"/><text x="48" y="722" class="muted" font-size="19">Legacy CSV: retrospective audit only</text></g></svg>
