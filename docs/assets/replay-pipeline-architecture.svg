<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">RL Sentinel: the information boundary</title><desc id="desc">Observations, transactional storage, as-of selection and recommendations form one path. Target outcomes enter only the scorer. Historical CSVs are audited separately.</desc><style>.bg{fill:#F3F7F5}.panel{fill:#fff;stroke:#C7D9D0;stroke-width:1.5}.ink{fill:#172E27}.muted{fill:#536D63}.accent{fill:#087F6A}.signal{fill:#087F6A}.signaltext{fill:#fff}.arrow{fill:none;stroke:#749889;stroke-width:2}.quiet{fill:#E4EDE8}
@media(prefers-color-scheme:dark){.bg{fill:#101918}.panel{fill:#162923;stroke:#365449}.ink{fill:#EDF8F5}.muted{fill:#ADC1BA}.accent{fill:#5EEAD4}.signal{fill:#196957}.signaltext{fill:#F2FFFA}.arrow{stroke:#82AB9B}.quiet{fill:#20392F}}</style><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" class="arrow"/></marker></defs><rect width="1000" height="500" rx="18" class="bg"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"><text x="32" y="53" class="ink" font-size="28" font-weight="700">One decision. Two information paths.</text><rect x="32" y="98" width="204" height="112" rx="12" class="panel"/><text x="50" y="124" class="accent" font-size="14" font-weight="700">01</text><text x="50" y="153" class="ink" font-size="25" font-weight="700">Observe</text><text x="50" y="179" class="muted" font-size="15">Lifecycle + samples</text><text x="50" y="199" class="muted" font-size="15">from a trusted producer</text><path d="M236 156h34" class="arrow" marker-end="url(#tip)"/><rect x="276" y="98" width="204" height="112" rx="12" class="panel"/><text x="294" y="124" class="accent" font-size="14" font-weight="700">02</text><text x="294" y="153" class="ink" font-size="25" font-weight="700">Store</text><text x="294" y="179" class="muted" font-size="15">Append-only events</text><text x="294" y="199" class="muted" font-size="15">SQLite batch transaction</text><path d="M480 156h34" class="arrow" marker-end="url(#tip)"/><rect x="520" y="98" width="204" height="112" rx="12" class="panel"/><text x="538" y="124" class="accent" font-size="14" font-weight="700">03</text><text x="538" y="153" class="ink" font-size="25" font-weight="700">Select @ T</text><text x="538" y="179" class="muted" font-size="15">Visible inputs only</text><text x="538" y="199" class="muted" font-size="15">history frozen at start</text><path d="M724 156h34" class="arrow" marker-end="url(#tip)"/><rect x="764" y="98" width="204" height="112" rx="12" class="panel"/><text x="782" y="124" class="accent" font-size="14" font-weight="700">04</text><text x="782" y="153" class="ink" font-size="25" font-weight="700">Recommend</text><text x="782" y="179" class="muted" font-size="15">Local advice only</text><text x="782" y="199" class="muted" font-size="15">no training intervention</text><path d="M866 210v65" class="arrow" marker-end="url(#tip)"/><rect x="32" y="283" width="390" height="96" rx="12" class="panel"/><text x="52" y="320" class="ink" font-size="25" font-weight="700">Target finish / label</text><text x="52" y="351" class="muted" font-size="18">Evaluation evidence, not predictor inputs</text><path d="M422 331h86" class="arrow" marker-end="url(#tip)"/><rect x="520" y="283" width="448" height="96" rx="12" class="signal"/><text x="542" y="320" class="signaltext" font-size="25" font-weight="700">Score + verify</text><text x="542" y="351" class="signaltext" font-size="18">Metrics · decision inputs · evidence bundle</text><rect x="32" y="422" width="936" height="48" rx="10" class="quiet"/><text x="52" y="453" class="muted" font-size="20">Separate path: historical CSV → retrospective audit only</text></g></svg>
