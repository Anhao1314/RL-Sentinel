<svg width="960" height="560" viewBox="0 0 960 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="560" rx="14" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="800" fill="#0F172A">Architecture</text>
  <text x="168" y="44" font-size="15" fill="#94A3B8">system structure — not experimental results</text>

  <!-- sources -->
  <rect x="40" y="70" width="300" height="70" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="190" y="100" text-anchor="middle" font-size="16.5" font-weight="600" fill="#334155">Training logs &amp; telemetry</text>
  <text x="190" y="124" text-anchor="middle" font-size="13.5" fill="#64748B">eval curves · TensorBoard · resources · reports</text>

  <path d="M190 140 L190 166" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>

  <rect x="40" y="170" width="300" height="58" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="190" y="205" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0F172A">Collector &amp; CSV schema</text>

  <path d="M190 228 L190 254" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>

  <rect x="40" y="258" width="300" height="58" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="190" y="284" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0F172A">Manual label merge</text>
  <text x="190" y="306" text-anchor="middle" font-size="13" fill="#64748B">by (task, seed); duplicates raise</text>

  <!-- three branches -->
  <path d="M340 287 L380 287" stroke="#94A3B8" stroke-width="2.2"/>
  <path d="M380 150 L380 424" stroke="#94A3B8" stroke-width="2.2"/>

  <rect x="384" y="120" width="270" height="62" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="519" y="146" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0F172A">Data-quality checks</text>
  <text x="519" y="168" text-anchor="middle" font-size="13" fill="#64748B">6 categories · 20+ checks</text>
  <path d="M380 151 L384 151" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>

  <rect x="384" y="256" width="270" height="62" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="519" y="282" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0F172A">Post-hoc factors &amp; cache</text>
  <text x="519" y="304" text-anchor="middle" font-size="13" fill="#64748B">cached ≡ direct pipeline equivalence</text>

  <rect x="384" y="392" width="270" height="62" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="519" y="418" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0F172A">Progress-filtered replay</text>
  <text x="519" y="440" text-anchor="middle" font-size="13" fill="#64748B">chronological; partial online visibility</text>
  <path d="M380 423 L384 423" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- predictor + decision -->
  <path d="M654 423 L700 423" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="704" y="372" width="216" height="60" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="812" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Predictor plugins</text>
  <text x="812" y="419" text-anchor="middle" font-size="12.5" fill="#64748B">rule · continue · stop</text>
  <path d="M812 432 L812 456" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="704" y="460" width="216" height="52" rx="10" fill="#0F172A"/>
  <text x="812" y="493" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">R0–R3 decision</text>

  <!-- side panel -->
  <rect x="384" y="330" width="270" height="46" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="519" y="359" text-anchor="middle" font-size="13.5" fill="#475569">Local panel polling → local recommendations only</text>

  <!-- boundary banner -->
  <rect x="40" y="466" width="616" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="60" y="492" font-size="14.5" font-weight="700" fill="#92400E">Known boundary</text>
  <text x="60" y="514" font-size="13.5" fill="#92400E">online_view still exposes the final runs-table metadata;</text>
  <text x="60" y="535" font-size="13.5" fill="#92400E">full look-ahead isolation is unfinished (see Limitations).</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M1,1 L7,4.5 L1,8" stroke="#94A3B8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
