<svg width="1100" height="620" viewBox="0 0 1100 620" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1100" height="620" rx="18" fill="#FFFFFF"/>
  <text x="44" y="48" font-size="23" font-weight="800" fill="#0F172A">Reliability v0.2 architecture</text>
  <text x="352" y="48" font-size="14" fill="#94A3B8">strict time-correct path + isolated retrospective path</text>

  <text x="54" y="96" font-size="13" font-weight="800" letter-spacing="1.5" fill="#2563EB">STRICT PATH</text>

  <rect x="44" y="116" width="210" height="76" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="149" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Training observer</text>
  <text x="149" y="169" text-anchor="middle" font-size="12.5" fill="#64748B">start · sample · finish · label</text>

  <path d="M254 154H302" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="308" y="116" width="220" height="76" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="418" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Immutable EventStore</text>
  <text x="418" y="169" text-anchor="middle" font-size="12.5" fill="#64748B">SQLite transaction · append-only</text>

  <path d="M528 154H576" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="582" y="116" width="220" height="76" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>
  <text x="692" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">As-of snapshot @ T</text>
  <text x="692" y="169" text-anchor="middle" font-size="12.5" fill="#64748B">event_time + available_at gates</text>

  <path d="M802 154H850" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="856" y="116" width="200" height="76" rx="12" fill="#0F172A"/>
  <text x="956" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Recommendation</text>
  <text x="956" y="169" text-anchor="middle" font-size="12.5" fill="#CBD5E1">continue · stop · abstain</text>

  <path d="M956 192V238" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="756" y="244" width="300" height="92" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
  <text x="906" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Chronological replay</text>
  <text x="906" y="298" text-anchor="middle" font-size="12.5" fill="#64748B">score recommendations against final outcomes</text>
  <text x="906" y="319" text-anchor="middle" font-size="12.5" fill="#64748B">coverage · precision · pass-kill · recall</text>

  <path d="M756 290H704" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="398" y="244" width="300" height="92" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="548" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Evidence bundle</text>
  <text x="548" y="298" text-anchor="middle" font-size="12.5" fill="#64748B">inputs · events · protocol · environment</text>
  <text x="548" y="319" text-anchor="middle" font-size="12.5" fill="#64748B">report · file sizes · SHA-256 manifest</text>

  <rect x="44" y="230" width="280" height="124" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="66" y="258" font-size="14" font-weight="800" fill="#334155">INPUT GUARANTEES</text>
  <text x="66" y="286" font-size="13" fill="#475569">• target final verdict excluded</text>
  <text x="66" y="309" font-size="13" fill="#475569">• future runs excluded</text>
  <text x="66" y="332" font-size="13" fill="#475569">• delayed labels stay invisible until available</text>

  <line x1="44" y1="396" x2="1056" y2="396" stroke="#E2E8F0" stroke-width="2"/>
  <text x="54" y="432" font-size="13" font-weight="800" letter-spacing="1.5" fill="#64748B">RETROSPECTIVE / LEGACY PATH</text>

  <rect x="44" y="454" width="254" height="82" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="171" y="485" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Historical CSVs</text>
  <text x="171" y="510" text-anchor="middle" font-size="12.5" fill="#64748B">preserved, read-only audit</text>

  <path d="M298 495H354" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="360" y="454" width="276" height="82" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.4"/>
  <text x="498" y="485" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Legacy replay compatibility</text>
  <text x="498" y="510" text-anchor="middle" font-size="12.5" fill="#9A3412">retrospective-only · not time-correct</text>

  <path d="M636 495H692" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="698" y="454" width="358" height="82" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.4"/>
  <text x="877" y="482" text-anchor="middle" font-size="15.5" font-weight="700" fill="#991B1B">Not eligible for strict online claims</text>
  <text x="877" y="506" text-anchor="middle" font-size="12.5" fill="#991B1B">old schema lacks per-event availability evidence</text>

  <text x="44" y="582" font-size="13" fill="#64748B">v0.2 deliberately separates what can be proven from what can only be inspected after the fact.</text>
</svg>