# One command: a trainer that looks healthy and then hangs, a watchdog agent
# that alerts on producer silence, Prometheus scraping it, and Grafana with a
# preloaded dashboard.  Open http://localhost:3000 (anonymous viewer) after
# `docker compose -f deploy/docker-compose.yml up --build`.
services:
  trainer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "sentinel_agent", "demo", "--out", "/data/events.jsonl",
              "--samples", "40", "--interval", "1"]
    volumes:
      - sentinel-data:/data

  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "sentinel_agent", "watch", "--events", "/data/events.jsonl",
              "--host", "0.0.0.0", "--port", "9101", "--stale-after", "30",
              "--poll-interval", "2"]
    volumes:
      - sentinel-data:/data
    ports:
      - "9101:9101"
    depends_on:
      - trainer

  prometheus:
    image: prom/prometheus:v2.53.4
    command: ["--config.file=/etc/prometheus/prometheus.yml",
              "--storage.tsdb.retention.time=1d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  sentinel-data: {}
